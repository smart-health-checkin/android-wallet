// The SMART Health Check-in look for Android apps: a Material 3 theme with the
// light and dark palettes of smart-health-checkin.org, Inter, the starburst logo,
// and a few shared pieces (top bar, cards, status pills). Used by the wallet and verifier-app.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "org.smarthealthit.checkin.theme"
    compileSdk 35

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    api platform("androidx.compose:compose-bom:2024.12.01")
    api "androidx.compose.material3:material3"
    api "androidx.compose.foundation:foundation"
    api "androidx.compose.ui:ui"
    api "androidx.activity:activity-compose:1.10.0"
}
