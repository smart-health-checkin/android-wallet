// Example: a native Android app as the Verifier for a SMART Health Check-in,
// through the browser (Custom Tab + message channel) or directly (Credential Manager).
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "org.smarthealthit.checkin.verifier"
    compileSdk 35

    defaultConfig {
        applicationId "org.smarthealthit.checkin.verifier"
        minSdk 26
        targetSdk 35
        // Releases pass -PversionCode and -PversionName, the same as the wallet's.
        versionCode((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName((project.findProperty("versionName") ?: "0.1.0").toString())
    }

    // -Pdebug-keystore=<path>: sign with that keystore (standard debug alias and
    // passwords). The shared key is the one /.well-known/assetlinks.json on
    // smart-health-checkin.org lists, which the browser path requires.
    if (project.hasProperty("debug-keystore")) {
        signingConfigs {
            debug {
                storeFile file(project.property("debug-keystore").toString())
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

dependencies {
    implementation project(":smart-checkin-mdoc")           // CBOR, P-256, HPKE open, SessionTranscript
    implementation project(":smart-checkin-theme")          // the site's look: Material 3 theme, Compose
    implementation "androidx.credentials:credentials:1.7.0-alpha03"
    // The verifier-side Digital Credentials call is always routed to the Play
    // services provider, which this artifact declares in its manifest.
    implementation "androidx.credentials:credentials-play-services-auth:1.7.0-alpha03"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.browser:browser:1.8.0"          // Custom Tabs + message channel
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}

configurations.all {
    resolutionStrategy {
        force "androidx.credentials:credentials:1.7.0-alpha03"
    }
}
