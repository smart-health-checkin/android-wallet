name: Release

# Builds the reference Android wallet as a debuggable APK and publishes it as a
# GitHub release. Every release is signed with the same debug key (repository
# secret ANDROID_DEBUG_KEYSTORE_B64, certificate SHA-256 84643eb6…), so each
# one installs over the last; the build fails if the APK has any other signer.
#
# Stable download link for the latest release:
#   https://github.com/smart-health-checkin/android-wallet/releases/latest/download/smart-health-checkin-wallet-debug.apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the fixed debug signing key
        run: |
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          [ -s "$RUNNER_TEMP/debug.keystore" ] || { echo "ANDROID_DEBUG_KEYSTORE_B64 is empty"; exit 1; }
      - name: Unit tests
        run: ./gradlew test -Pskip-matcher
      - name: Build
        # The matcher (app/src/main/assets/matcher.wasm) is committed, so the
        # nightly Rust toolchain isn't needed here. Rebuild it locally with
        # app/matcher-rs/build.sh when its source changes.
        run: |
          # versionCode must only ever grow, or installed wallets can't
          # update. It comes from the version (0.3.5 -> 3005), not the run
          # number, which restarted when this repo was split out of spec
          # (whose releases reached versionCode 5). Untagged dev builds use
          # the run number and stay below every release.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
            VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          else
            VERSION_NAME="0.1.${{ github.run_number }}-dev"
            VERSION_CODE=${{ github.run_number }}
          fi
          ./gradlew :app:assembleDebug -Pskip-matcher -Pdebug-keystore="$RUNNER_TEMP/debug.keystore" \
            -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk smart-health-checkin-wallet-debug.apk
      - name: Signed with the shared key
        # A release signed with any other key can't install over earlier ones.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs smart-health-checkin-wallet-debug.apk | tee /dev/stderr \
            | grep -q "SHA-256 digest: 84643eb69bc95a2dc4ec2d4d92af77a64a8cb00f0e2c7b99bce393cee202dda4"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || TAG="v$VERSION_NAME"
          gh release create "$TAG" smart-health-checkin-wallet-debug.apk \
            --title "Reference Android wallet v$VERSION_NAME" \
            --notes "Debuggable build of the SMART Health Check-in reference Android wallet.

          Install on the phone by opening the APK link, or with adb:

              curl -LO https://github.com/smart-health-checkin/android-wallet/releases/latest/download/smart-health-checkin-wallet-debug.apk
              adb install -r smart-health-checkin-wallet-debug.apk

          Requires Android 8 or later and a Chrome with the Digital Credentials API. Open the app once after installing so it registers with Credential Manager." \
            --latest
